# Downloads NASA FIRMS fire detections, removes settlements, offshore platforms and gas flares,
# and updates fire-globe/data. Start it by hand: Actions > Update fire data > Run workflow.
# Needs the repository secret FIRMS_MAP_KEY (free: https://firms.modaps.eosdis.nasa.gov/api/map_key/).
name: Update fire data

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days
        default: '90'
      end:
        description: Last day, YYYY-MM-DD (leave empty for yesterday)
        default: ''
  # To refresh every Monday at 03:00 UTC, remove the # from the next two lines.
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fire-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Cache settlement and border data
        uses: actions/cache@v4
        with:
          path: |
            pipeline/cache/ghsl
            pipeline/cache/ne
          key: base-data-ghsl-smod-e2025-r2023a-v2-ne50m
      - name: Build fire data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          DAYS: ${{ inputs.days || '90' }}
          END: ${{ inputs.end }}
        run: |
          if [ -n "$END" ]; then python pipeline/fires.py --days "$DAYS" --end "$END"; else python pipeline/fires.py --days "$DAYS"; fi
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fire-globe/data
          git diff --cached --quiet || git commit -m "Update fire data, $(date -u +%F)"
          git push

  deploy:
    needs: data
    uses: ./.github/workflows/deploy.yml
