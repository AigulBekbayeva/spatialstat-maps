<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpatialStat interactive maps</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="shared/brand/favicon.svg">
<link rel="stylesheet" href="shared/embed.css">
<style>
  body { overflow: auto; display: block; padding: clamp(20px, 5vw, 56px); background: #061418; }
  img { height: 28px; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.035em; margin: 28px 0 8px; }
  p { color: var(--text-soft); max-width: 36rem; }
  ul { list-style: none; padding: 0; margin: 28px 0; display: grid; gap: 12px; max-width: 36rem; }
  li a { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--text); }
  li a:hover { border-color: var(--signal-soft); }
  li span { display: block; font-size: 13px; color: var(--text-mute); }
</style>
</head>
<body>
  <a href="https://spatialstat.com/"><img src="shared/brand/logo-dark.svg" alt="SpatialStat"></a>
  <h1>Interactive maps</h1>
  <p>Interactive maps for stories on <a href="https://spatialstat.com/">spatialstat.com</a>. Every map has a source.</p>
  <ul>
    <li><a href="fire-globe/">Fire on Earth<span>Three months of vegetation fires detected by NASA satellites</span></a></li>
  </ul>
  <p><a href="https://spatialstat.com/licensing/">Licensing</a></p>
</body>
</html>
